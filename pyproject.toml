[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero"
version = "0.1.0"
description = "Autonomous agent system for web-app pentesting (Phase 1)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
    "httpx>=0.27",
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "trafilatura>=1.8",
    "ddgs>=6.0",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "mcp>=1.2",
    "uvicorn>=0.27",
    "starlette>=0.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
zero = "zero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Default run = unit (offline, free) + docker sandbox tests (free, need the built
# image). Token-spending LIVE runs are excluded by default; opt in with
# `-m live` (a command-line `-m` overrides this). See README / CLAUDE.md.
addopts = "-m 'not live'"
markers = [
    "live: real token-spending run against a live LLM (claude). Opt-in: `pytest -m live`.",
    "docker: tests that require a running Docker daemon and the built `zero-sandbox` image",
    "live_claude: tests that shell out to the real `claude` CLI (slow, costs tokens, needs auth)",
    "gruyere: live full-stack run against Google Gruyere (slow, costs tokens, needs docker + claude)",
    "regression: capability regression vs vulnerable docker targets (slow, costs claude tokens, needs docker + claude). Opt-in: `pytest -m regression`.",
    "regression_blind: blind capability benchmark vs vulnerable docker targets — never fails, prints coverage %. Opt-in: `pytest -m regression_blind`.",
]

[tool.ruff]
line-length = 100
target-version = "py311"
