[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-web"
version = "0.1.0"
description = "Local Studio interface for Zero"
requires-python = ">=3.11"
dependencies = ["zero", "starlette>=0.36", "uvicorn>=0.27"]

[project.scripts]
zero-web = "zero_web.app:main"

[tool.uv.sources]
zero = { path = "../..", editable = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["docker: free tests requiring the sandbox image", "live: opt-in model spending", "ui_live: web product live matrix", "live_codex: Codex", "gruyere: hosted lab"]

[tool.setuptools.package-data]
zero_web = ["config-schema.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
